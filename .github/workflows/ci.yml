name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # ``not live`` (issue #108): the live suite drives the REAL LLM and
      # the REAL Docker render worker (trailing minutes per case, token
      # cost, non-deterministic). CI has no repository secret for the key
      # and no Docker — the marker exclusion is what keeps this fast
      # job from ever calling the real LLM. The live suite is NOT a PR
      # gate: it runs locally via `uv run pytest -m live` (see AGENTS.md).
      - run: pytest -m "not slow and not live"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: web
      - run: npm run type-check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
