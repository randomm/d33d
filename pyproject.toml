[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "d33d"
version = "0.0.1"
description = "d33d: parametric 3D design loop (OpenSCAD-driven) with 3MF print validation. Shell package — application code lands in later tickets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "trimesh",
    "networkx",
    "lxml",
    "pymeshfix",
    "cryptography",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["d33d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that require Docker (run only on the linux/amd64 target box, never in CI)",
    "live: tests that drive a request through the REAL LLM and the REAL Docker render worker (issue #108) — never in CI, no repository secret exists for the key; run locally with `uv run pytest -m live` when Docker and TRAIL_OPENERS_LLM_KEY are available",
]
